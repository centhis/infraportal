
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA Routing: Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /docs, /redoc, /openapi.json if needed
    location /docs {
        proxy_pass http://backend:8000/docs;
    }
    
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    # Proxy Flower (if exposed via /celery prefix or separate port)
    # Project plan: 4.7.2 says API endpoint /celery/status in backend. API handles it.
    # But if we want full flower logic, we can proxy /flower -> flower:5555
    # For now, stick to backend API proxy.
}
