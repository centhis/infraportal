
services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    # Note: Default redis:alpine doesn't enforce ACLs without config.
    # User might mount a config via volumes if needed, 
    # OR rely on existing infrastructure where these strings are valid.
    # Here we just provide the service.
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      # Backend uses REDIS_TASK_URL for Celery broker connection in config.py
      REDIS_TASK_URL: ${REDIS_URL_BACKEND}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      API_PREFIX: ${API_PREFIX}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      
      # LDAP Settings
      LDAP_ENABLED: ${LDAP_ENABLED}
      LDAP_URI: ${LDAP_URI}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER}
      LDAP_SYNC_SCHEDULE: ${LDAP_SYNC_SCHEDULE}

      CELERY_WORKER_API_KEY: ${CELERY_WORKER_API_KEY}
    expose:
      - "8000"
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  worker:
    build:
      context: ./celery_worker
      dockerfile: Dockerfile
    deploy:
      mode: replicated
      replicas: 2
    environment:
      # Mapped to WorkerSettings in celery_worker/config.py
      REDIS_TASK_URL: ${REDIS_URL_WORKER_BROKER}
      REDIS_RESULT_URL: ${REDIS_URL_WORKER_RESULT}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE}
      CELERY_ENABLE_UTC: ${CELERY_ENABLE_UTC}
      BACKEND_INTERNAL_API_URL: ${BACKEND_INTERNAL_API_URL}
      CELERY_WORKER_API_KEY: ${CELERY_WORKER_API_KEY}
    networks:
      - app_network
    depends_on:
      - backend
      - redis

  beat:
    build:
      context: ./celery_beat
      dockerfile: Dockerfile
    container_name: beat
    environment:
      # Mapped to BeatSettings in celery_beat/config.py
      REDIS_TASK_URL: ${REDIS_URL_BEAT}
      CELERY_RESULT_BACKEND: ${REDIS_URL_WORKER_RESULT} # Optional if beat checks results, but usually not needed. Kept for safety.
      CELERY_TIMEZONE: ${CELERY_TIMEZONE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    networks:
      - app_network
    depends_on:
      - redis
    volumes:
      - beat_data:/app/scheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_ALERT_TIMEOUT: ${VITE_ALERT_TIMEOUT}
    container_name: frontend
    expose:
      - "3000"
    networks:
      - app_network
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network
    depends_on:
      - frontend
      - backend

  flower:
    image: mher/flower
    container_name: flower
    environment:
      # Flower needs to know which broker to monitor
      CELERY_BROKER_URL: ${REDIS_URL_FLOWER}
    expose:
      - "5555"
    networks:
      - app_network
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  backend_data:
  beat_data:

networks:
  app_network:
    driver: bridge
