[project]
name = "backend"
version = "0.1.0"
description = "Infraportal Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "argon2-cffi>=25.1.0",
    "celery-sqlalchemy-scheduler>=0.3.0",
    "cryptography>=46.0.3",
    "fastapi[all]>=0.118.0",
    "httpx>=0.28.1",
    "ldap3>=2.9.1",
    "psycopg2-binary>=2.9.10",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-dotenv>=0.5.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "pytz>=2025.2",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.43",
]

[project.scripts]
lang-lint = "tools.lang_linter:main"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    "alembic/versions",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument (standard FastAPI pattern with Depends())
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools"]

